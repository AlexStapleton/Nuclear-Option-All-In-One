<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Nuclear Option</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <main class="sign-in">
        <section class="card sign-in-card" aria-labelledby="sign-in-title">
            <div class="brand"><span class="mark" aria-hidden="true">N</span>Nuclear Option</div>
            <h1 id="sign-in-title">Sign in to the server panel</h1>
            {% if bootstrap %}<p class="meta">First sign-in? Use the generated password from <code>.panel.env</code>.</p>{% endif %}
            {% for message in get_flashed_messages() %}<p role="status">{{ message }}</p>{% endfor %}
            {% if error %}<p class="sign-in-error" role="alert">{{ error }}</p>{% endif %}
            <form method="post" action="{{ url_for('login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next_page }}">
                <label for="username">Username</label>
                <input id="username" name="username" value="{{ username }}" autocomplete="username" required>
                <label for="password">Panel password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
                <button class="primary" type="submit">Sign in</button>
            </form>
        </section>
    </main>
</body>
</html>
