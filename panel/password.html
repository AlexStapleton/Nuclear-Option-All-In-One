<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change panel password · Nuclear Option</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    {% include 'session-head.html' %}
</head>
<body>
    {% include 'navigation.html' %}
    <main class="sign-in">
        <section class="card sign-in-card" aria-labelledby="password-title">
            <h1 id="password-title">Change panel password</h1>
            <p class="meta">This password is for the web panel. Saving a new password signs out all panel sessions.</p>
            {% if error %}<p class="sign-in-error" role="alert">{{ error }}</p>{% endif %}
            <form method="post" action="{{ url_for('change_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="current-password">Current password</label>
                <input id="current-password" name="current_password" type="password" autocomplete="current-password" required autofocus>
                <label for="new-password">New password</label>
                <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" aria-describedby="password-help" required>
                <p id="password-help" class="meta">Use at least 12 characters.</p>
                <label for="confirm-password">Confirm new password</label>
                <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" maxlength="256" required>
                <button class="primary" type="submit">Save new password</button>
            </form>
        </section>
    </main>
</body>
</html>
